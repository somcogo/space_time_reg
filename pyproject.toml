[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stmr"
version = "0.1.0"
description = "Space-time (motion-regularised) reconstruction for dynamic MRI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "torchvision",
    "torchdiffeq",
    "numpy",
    "fastmri",
    "flow-vis",
    "matplotlib",
    "scikit-image",
    "pillow",
    "pyyaml",
    "tensorboard",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# cbct (stmr/data/ct_utils.py, stmr/data/spare_data.py) needs torch-radon (carterbox
# fork, github.com/carterbox/torch-radon) for its differentiable fan-beam projector.
# It has no PyPI package -- build from source against the local torch/CUDA install:
#   git clone https://github.com/carterbox/torch-radon.git && cd torch-radon
#   export CUDA_HOME=<a CUDA toolkit matching torch.version.cuda>
#   export PATH="$CUDA_HOME/bin:$PATH"
#   python -m pip install --no-build-isolation -e .
# (On this dev environment: CUDA_HOME was the conda env itself after
# `conda install -c nvidia cuda-nvcc=12.4.131 cuda-cudart-dev=12.4 cuda-cccl=12.4
# libcurand-dev=10.3.5.147 --no-deps` -- --no-deps avoids conda pulling in a `numpy-base`
# package that corrupts a pip-installed numpy in a pre-existing "inconsistent" env.)

[project.scripts]
stmr-run = "stmr.cli:main"

[tool.setuptools.packages.find]
include = ["stmr*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "motion_findings", "data", "weights"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: import sorting, UP: pyupgrade, B: bugbear
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length handled case-by-case; many long tensor expressions
    "E741",   # ambiguous variable names (l, I) used in math-heavy code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
# Vendored regularizer code (kept close to upstream): allow its default-arg style.
"stmr/regularizers/*" = ["B006", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
