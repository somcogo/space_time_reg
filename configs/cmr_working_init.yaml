# Full pipeline on CMRxRecon P001, static (time-constant) mask + WCRR denoiser.
# Ported from the old bash_script.sh (soft_con / tuned_kt_dc_wcrr); the k-t mask it used
# is replaced by the time-constant 'st' mask.
exp_name: cmr/soft_con_init_fix/full_pipeline
dataset: cmr_P001
device: cuda
seed: 0

# data / mask
time_points: 12
start_frame: 0
slice_number: 0
factor: 4
mask: st
normalize_data: true

# initial reconstruction (nmAPG)
use_nmapg: true
recon_epochs: 300
init_lr: 1.0e-2
init_loss: l2
init_grad: analytic
tol: 0.0
lambda_init_recon: 0.2
init_reg_abs: false

# reconstruction regularizer
reg: learned
reg_variant: crr
reg_alpha: 1.0
reg_beta: 3.0
recon_scale: 3.55

# velocity network
func_name: groupsiren
siren_depth: 3
siren_dim: 64
last_init_zero: true

# ODE solver
solver: euler
step_size: 0.1
atol: 1.0e-8
rtol: 1.0e-6

# optimisation
epochs: 2000
lr: 1.0e-4
recon_lr: 1.0e-5
recon_eps: 1.0e-4
weight_decay: 0
learn_recon: true
interval: 0
motion_warmup: 0
use_nreps: false

# losses
loss: mse
lambda_st: 1.0
lambda_grad_phi: 1.0e0
lambda_grd: 0
lambda_lap: 0
lambda_hel: 0
lambda_recon: 1.0e-1
lambda_rl2: 1.0e+2

log_cadence: 50
debug: false
