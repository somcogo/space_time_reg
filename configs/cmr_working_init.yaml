# Full pipeline on CMRxRecon P001, static (time-constant) mask + WCRR denoiser.
# Ported from the old bash_script.sh (soft_con / tuned_kt_dc_wcrr); the k-t mask it used
# is replaced by the time-constant 'st' mask.
# The joint loop optimizes the nmAPG init's own energy (joint_objective: init) plus the motion
# terms; recon_lr from the 2026-10 sweeps (log/cmr/soft_con_init_fix/initobj_*). lr, lambdas,
# net and epochs from the 2026-10-23 grid (log/cmr/grid/grid_v1, stmr/gridsearch; ranked on
# cropped PSNR): 26.94 +- 0.03 dB cropped over 3 seeds, +0.72 dB over the init.
exp_name: cmr/soft_con_init_fix/full_pipeline
dataset: cmr_P001
device: cuda
seed: 0

# data / mask
time_points: 12
start_frame: 0
slices: [0]
factor: 4
mask: st
normalize_data: true

# initial reconstruction (nmAPG)
use_nmapg: true
recon_epochs: 300
init_lr: 1.0e-2
init_loss: l2
init_grad: analytic
tol: 0.0
lambda_init_recon: 0.1  # on the lambda_rl2 / lambda_init_recon diagonal: only the balance matters
init_reg_abs: false

# reconstruction regularizer
reg: learned
reg_variant: crr
reg_alpha: 1.0
reg_beta: 3.0
recon_scale: 3.55

# velocity network
func_name: groupsiren
siren_depth: 3
siren_dim: 64  # 128 bought nothing
siren_omega: 30  # 15 is -0.16 dB, 45/60 -0.05 dB
last_init_zero: true
last_init_std: 1.0e-6  # last layer ~ N(0, std^2): random, ~1e-3 px initial motion

# ODE solver
solver: euler
step_size: 0.5  # 0.1 bought nothing, at 2-2.6x the time
adjoint: true  # direct backprop OOMs a 44 GB A40 at siren_dim 128 / step_size 0.1
atol: 1.0e-8
rtol: 1.0e-6

# optimisation
epochs: 4000  # 2000 -> 4000 is +0.05 dB; 6000/8000 only +0.03 more (within seed noise)
lr: 2.0e-4  # velocity net; 1e-4 is the same, 1e-3 is unstable (periodic imdiff / grad_phi spikes)
recon_lr: 1.0e-3  # recon was the bottleneck at 1e-5; 1e-3..1e-2 is a plateau, 3e-2 too high
lr_schedule: "cosine"
lr_min: 1.0e-5
recon_eps: 1.0e-4
weight_decay: 0
learn_recon: true
interval: 0
motion_warmup: 0
use_nreps: false

# losses
loss: mse
lambda_st: 1.0
lambda_grad_phi: 3.0  # isotropic pixel-unit grad_phi; 1e-4 * lambda_rl2 (grid: 3e-5..1e-4 best)
lambda_grd: 0
lambda_lap: 0
lambda_recon: 1.0e-1  # unused with joint_objective: init (lambda_init_recon weights the reg)
lambda_rl2: 3.0e+4  # imdiff is a per-pixel mean; 1e5 with lambda_init_recon 0.2 is close behind

log_cadence: 50
metric_cadence: 10
debug: false
