# Lung CBCT (SPARE, patient P1, scan T_01), 2D fan-beam mid-slice approximation.
# Real respiratory-phase-binned undersampling (RespBin.csv), not a synthetic mask --
# `raw` is the actual sparse subset of the real acquisition (see stmr/data/spare_data.py).
# Mirrors cmr_soft_con.yaml's structure so the two are directly comparable, minus the
# CBCT-incompatible knobs (use_nmapg's complex-only unpack_measurements, ktavg
# init's FastmriIFT call, sim_domain=image's ifft2c_new call -- all MRI/FFT-specific).
exp_name: spare/soft_con/full_pipeline
dataset: cbct_P1T01
device: cuda
seed: 0

# data / mask
time_points: 10
start_frame: 0
slice_number: 0

# initial reconstruction (plain grad-descent init, not nmAPG -- nmAPG's
# unpack_measurements hardcodes a 2-channel complex split).
# 'adj' (unfiltered backprojection) is a poor init for CBCT: unlike MRI's IFFT, the
# unfiltered Radon adjoint isn't scale-matched to the forward projector's expected input
# (its magnitude is orders of magnitude too large), which blew up the init-recon loss.
# 'zero' is safe and dataset-agnostic (get_init shapes it from gt_im, not raw_kspace_data).
use_nmapg: false
init: zero
recon_epochs: 150
init_lr: 1.0e-2
init_loss: l2
lambda_init_recon: 2.0e-2

# reconstruction regularizer (pretrained on CT -- a more native fit for CBCT's
# real-valued images than for the complex MRI images it's normally applied to)
reg: learned
reg_variant: wcrr
reg_alpha: 1.0
recon_scale: 6.0

# velocity network
func_name: groupsiren
siren_depth: 3
siren_dim: 64
last_init_zero: true

# ODE solver
solver: euler
step_size: 0.1
atol: 1.0e-8
rtol: 1.0e-6

# optimisation
epochs: 2000
lr: 1.0e-4
recon_lr: 1.0e-5
recon_eps: 1.0e-4
weight_decay: 0
learn_recon: true
interval: 0
motion_warmup: 0
use_nreps: false

# losses (sim_domain left at its 'fourier' default -- despite the name, similarity_loss's
# 'fourier' branch just calls the registered forward operator generically; 'image' would
# call the FFT-specific ifft2c_new and break)
loss: mse
lambda_st: 1.0
lambda_grad_phi: 1.0e-3
lambda_grd: 0
lambda_lap: 0
lambda_hel: 0
lambda_recon: 1.0
lambda_rl2: 1.0e+2

log_cadence: 50
debug: false
